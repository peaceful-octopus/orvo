name: Docker check (temporary)
# Tries the corepack pnpm setup on each OS the workflows use. Deleted before merging.
on:
  push:
    branches: [ci-node24]
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Keep the pnpm store on the same drive as the checkout
        if: runner.os == 'Windows'
        shell: bash
        run: echo "npm_config_store_dir=${RUNNER_TEMP}\.pnpm-store" >> "$GITHUB_ENV"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --version

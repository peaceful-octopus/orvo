name: CI
# Pushes to main run the quick checks only. The browser suites are slow, so they run on pull requests, on release tags and
# on demand (Actions > CI > Run workflow).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:all

  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:tiers
      - run: pnpm test:e2e:effects
      - run: pnpm test:e2e:admin

  fleet:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:fleet
  redis:
    runs-on: ubuntu-latest
    needs: check
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          REDIS_URL: redis://localhost:6379

name: CI
# Pushes to main run the quick checks only. The browser suites are slow, so they run on pull requests, on release tags and
# on demand (Actions > CI > Run workflow).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:all

  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:tiers
      - run: pnpm test:e2e:effects
      - run: pnpm test:e2e:admin

  fleet:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:fleet
  android:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # The emulator architecture (Intel/AMD) and the one nearly every phone uses.
          - target: x86_64
            rust: x86_64-linux-android
          - target: aarch64
            rust: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: android-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # The runner image ships the Android SDK and an NDK; Gradle fetches any platform it is missing.
      - run: pnpm --filter @orvo/desktop tauri android build --debug --apk --target ${{ matrix.target }}
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
      - uses: actions/upload-artifact@v7
        with:
          name: orvo-android-${{ matrix.target }}
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  redis:
    runs-on: ubuntu-latest
    needs: check
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          REDIS_URL: redis://localhost:6379

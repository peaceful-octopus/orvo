name: Release
# Push a tag such as v1.0.0 (after `pnpm version:set 1.0.0` and a commit) to build the Windows and macOS installers and
# attach them, with the update manifest the desktop app polls, to a draft GitHub Release. Publish the draft to roll it out. The
# same tag also publishes the server image to ghcr.io, so the server and the apps are released together.
# The Android APK is attached to the release only when the release keystore secrets are set (docs/android.md); without
# them the job does nothing. Debug-signed APKs, signed with a public key, are only ever built on a manual run, as artifacts
# for testing. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  # A manual run (Actions > Release > Run workflow) builds only the Android APKs, as artifacts, to try that build without releasing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pnpm links packages from its store, which must be on the same drive as the checkout (D: on Windows runners).
      - name: Keep the pnpm store next to the checkout
        if: runner.os == 'Windows'
        shell: bash
        run: echo "npm_config_store_dir=${RUNNER_TEMP}\.pnpm-store" >> "$GITHUB_ENV"
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: The tag must match the version in the files
        shell: bash
        run: |
          pnpm version:check
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - run: pnpm test:all
        if: matrix.os == 'windows-latest'
      - name: Point the updater at this repository's releases
        shell: bash
        run: sed -i.bak "s#OWNER/REPO#${GITHUB_REPOSITORY}#" apps/client/src-tauri/tauri.conf.json && rm apps/client/src-tauri/tauri.conf.json.bak
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Orvo ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true

  # Debug-signed APKs, for testing only: the debug key is public, so anyone could build an APK that installs over one of
  # these as an update. They are kept as short-lived artifacts of a manual run and never attached to a release. Publishing
  # an Android app needs a release keystore kept in repository secrets.
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The emulator architecture (Intel/AMD) and the one nearly every phone uses.
          - target: x86_64
            rust: x86_64-linux-android
          - target: aarch64
            rust: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
          key: android-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # The runner image ships the Android SDK and an NDK; Gradle fetches any platform it is missing.
      - run: |
          export NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $NDK_HOME"
          pnpm --filter @orvo/client tauri android build --debug --apk --target ${{ matrix.target }}
      - name: Android unit tests
        if: matrix.target == 'x86_64'
        run: ./gradlew :app:testUniversalDebugUnitTest
        working-directory: apps/client/src-tauri/gen/android
      - name: Name the APK after the version and architecture
        run: cp apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk "Orvo_v$(node -p "require('./package.json').version")_android_${{ matrix.target }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: orvo-android-${{ matrix.target }}
          path: Orvo_*.apk
          retention-days: 7
          if-no-files-found: error

  # The release APK for phones (arm64), signed with the release keystore from repository secrets. Skipped, with a notice,
  # until those secrets exist, so a release is never held up by it and never carries a debug-signed app.
  android-release:
    if: github.event_name == 'push'
    needs: desktop
    runs-on: ubuntu-latest
    env:
      ORVO_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ORVO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORVO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORVO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check that the signing secrets are set
        id: gate
        run: |
          if [ -n "$ORVO_ANDROID_KEYSTORE_BASE64" ] && [ -n "$ORVO_ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ORVO_ANDROID_KEY_ALIAS" ] && [ -n "$ORVO_ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Android release skipped: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (docs/android.md)."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled
      - run: corepack enable pnpm
        if: steps.gate.outputs.enabled
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        if: steps.gate.outputs.enabled
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.enabled
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        if: steps.gate.outputs.enabled
        with:
          workspaces: apps/client/src-tauri
          key: android-release
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.enabled
      - name: The tag must match the version in the files
        if: steps.gate.outputs.enabled
        run: |
          pnpm version:check
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - name: Build the signed release APK
        if: steps.gate.outputs.enabled
        run: |
          echo "$ORVO_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ORVO_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          export NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          pnpm --filter @orvo/client tauri android build --apk --target aarch64
      # A release must be signed by the release key and by nothing public: check the result, not the settings.
      - name: Verify the signature
        if: steps.gate.outputs.enabled
        run: |
          apk=$(ls apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          test "$(echo "$apk" | wc -l)" = 1
          case "$apk" in *unsigned*) echo "The APK is unsigned"; exit 1;; esac
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          debug=$(keytool -list -v -keystore apps/client/src-tauri/gen/android/app/debug.keystore -storepass android | sed -n 's/^ *SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          if grep -qi "$debug" "$RUNNER_TEMP/certs.txt"; then echo "The APK is signed with the public debug key"; exit 1; fi
          cp "$apk" "Orvo_${GITHUB_REF_NAME}_android_arm64.apk"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.enabled
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: Orvo_*.apk

  # The server image is released with the clients, so a server and the apps that talk to it share a version. It is
  # published right away (unlike the draft desktop release): `latest`, the version and the commit.
  server:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag must match the version in the files
        run: |
          pnpm version:check
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

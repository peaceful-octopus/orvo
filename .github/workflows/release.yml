name: Release
# Push a tag such as v1.0.0 (after `pnpm version:set 1.0.0` and a commit) to build the Windows and macOS installers and the
# Android APKs (x86_64 and arm64) and attach them, with the update manifest the desktop app polls, to a draft GitHub Release. Publish the draft to roll it out. The
# same tag also publishes the server image to ghcr.io, so the server and the apps are released together.
# See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  # A manual run (Actions > Release > Run workflow) builds only the Android APKs, as artifacts, to try that build without releasing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pnpm links packages from its store, which must be on the same drive as the checkout (D: on Windows runners).
      - name: Keep the pnpm store next to the checkout
        if: runner.os == 'Windows'
        shell: bash
        run: echo "npm_config_store_dir=${RUNNER_TEMP}\.pnpm-store" >> "$GITHUB_ENV"
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: The tag must match the version in the files
        shell: bash
        run: |
          pnpm version:check
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - run: pnpm test:all
        if: matrix.os == 'windows-latest'
      - name: Point the updater at this repository's releases
        shell: bash
        run: sed -i.bak "s#OWNER/REPO#${GITHUB_REPOSITORY}#" apps/client/src-tauri/tauri.conf.json && rm apps/client/src-tauri/tauri.conf.json.bak
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Orvo ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true

  # Debug-signed APKs for now: they install by sideloading but are not for the Play Store, which needs a release keystore.
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The emulator architecture (Intel/AMD) and the one nearly every phone uses.
          - target: x86_64
            rust: x86_64-linux-android
          - target: aarch64
            rust: aarch64-linux-android
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
          key: android-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: The tag must match the version in the files
        if: github.event_name == 'push'
        run: |
          pnpm version:check
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      # The runner image ships the Android SDK and an NDK; Gradle fetches any platform it is missing.
      - run: pnpm --filter @orvo/client tauri android build --debug --apk --target ${{ matrix.target }}
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
      - name: Name the APK after the version and architecture
        run: cp apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk "Orvo_v$(node -p "require('./package.json').version")_android_${{ matrix.target }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: orvo-android-${{ matrix.target }}
          path: Orvo_*.apk
          retention-days: 7
          if-no-files-found: error

  # The desktop job creates the draft release, so the APKs are added once it exists.
  attach-android:
    if: github.event_name == 'push'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: orvo-android-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: Orvo_*.apk

  # The server image is released with the clients, so a server and the apps that talk to it share a version. It is
  # published right away (unlike the draft desktop release): `latest`, the version and the commit.
  server:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag must match the version in the files
        run: |
          pnpm version:check
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

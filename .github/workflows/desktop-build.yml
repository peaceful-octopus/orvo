name: Desktop build
# Builds the desktop installers on demand (Actions tab, "Run workflow") and keeps them as downloadable artifacts for a
# week. Unlike the Release workflow it needs no tag, publishes nothing and does not sign updates. macOS builds are
# not signed with a Developer ID or notarized, so Gatekeeper blocks the first launch. On macOS 15 and later, try to open
# the app once, then choose Open Anyway in System Settings, Privacy & Security (or run
# `xattr -dr com.apple.quarantine /Applications/Orvo.app`). Right-click, Open no longer works there.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            # One path per line: upload-artifact reads a space-separated pair as a single pattern and finds nothing.
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            args: --target universal-apple-darwin
            bundles: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pnpm links packages from its store, which must be on the same drive as the checkout (D: on Windows runners).
      - name: Keep the pnpm store next to the checkout
        if: runner.os == 'Windows'
        shell: bash
        run: echo "npm_config_store_dir=${RUNNER_TEMP}\.pnpm-store" >> "$GITHUB_ENV"
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orvo/desktop build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: orvo-${{ matrix.os }}
          path: ${{ matrix.bundles }}
          retention-days: 7
          if-no-files-found: error

name: Desktop build
# Builds the desktop installers on demand (Actions tab, "Run workflow") and keeps them as downloadable artifacts for a
# week. Unlike the Release workflow it needs no tag, publishes nothing and does not sign updates. macOS builds are
# unsigned, so Gatekeeper asks you to open them with right-click, Open the first time.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            bundles: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            args: --target universal-apple-darwin
            bundles: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orvo/desktop build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: orvo-${{ matrix.os }}
          path: ${{ matrix.bundles }}
          retention-days: 7

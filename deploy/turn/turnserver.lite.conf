# ChillCall TURN pool for the "relay-lite" tier: capped to roughly audio speeds so it costs about
# one twelfth of a video relay. max-bps is bytes per second per session (8000 = 64 kbit/s).
listening-port=3479
min-port=50176
max-port=51199
user-quota=10
total-quota=2000
max-bps=8000
# Credentials are minted by the beacon (HMAC of an expiry timestamp); the shared secret comes from the
# command line (--static-auth-secret), never from this file.
use-auth-secret
realm=chillcall
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Add cert=/pkey= and tls-listening-port=5349 to also accept TURN over TLS (helps behind strict firewalls).
no-tls
no-dtls
stale-nonce=600

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

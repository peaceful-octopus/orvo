# Personal Orvo: one container, with optional HTTPS (Caddy) and optional self-hosted STUN (coturn).
#
#   docker compose up -d                                  # http://localhost:8080
#   DOMAIN=orvo.example.com BEHIND_PROXY=1 docker compose --profile https up -d
#   docker compose --profile stun up -d                   # then set STUN_URLS=stun:<your-host>:3478
services:
  orvo:
    build: ../..
    restart: unless-stopped
    # Must be longer than DRAIN_MS (5 s): the server keeps serving for that long after SIGTERM, and Docker
    # kills it when this runs out (some Docker installs default to just one second).
    stop_grace_period: 15s
    ports:
      - "8080:8080"
    environment:
      BEHIND_PROXY: ${BEHIND_PROXY:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Optional sign-in with an OpenID Connect provider; see docs/accounts.md.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DESKTOP_CLIENT_ID: ${OIDC_DESKTOP_CLIENT_ID:-}
      OIDC_DESKTOP_CLIENT_SECRET: ${OIDC_DESKTOP_CLIENT_SECRET:-}
      ROOM_CREATION: ${ROOM_CREATION:-anyone}
      DEFAULT_ROOM_ACCESS: ${DEFAULT_ROOM_ACCESS:-anyone}
    volumes:
      - orvo-data:/data

  # Browsers only allow camera access over HTTPS (or on localhost), so friends connecting over the
  # internet need this or your own reverse proxy. Certificates are issued automatically.
  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - orvo

  # STUN only (no relay), so it costs almost no bandwidth. Needs UDP 3478 reachable from the internet.
  coturn:
    profiles: ["stun"]
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: ["--stun-only", "--no-tls", "--no-dtls", "--no-cli", "--fingerprint", "--listening-port=3478"]

volumes:
  orvo-data:
  caddy-data:

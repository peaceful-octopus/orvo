# Personal Orvo: one container. Friends over the internet need HTTPS, so put your own reverse proxy in front of
# port 8080 (it must pass WebSocket upgrades on /ws) and set BEHIND_PROXY=1.
#
#   docker compose up -d                                  # http://localhost:8080
#   BEHIND_PROXY=1 docker compose up -d                   # behind a reverse proxy
#   docker compose --profile turn up -d                   # also run a relay (see the turn service)
services:
  orvo:
    # Published image. To build from this checkout instead, add `build: ../..` and run `docker compose up -d --build`.
    image: ${ORVO_IMAGE:-ghcr.io/peaceful-octopus/orvo:latest}
    restart: unless-stopped
    # Must be longer than DRAIN_MS (5 s): the server keeps serving for that long after SIGTERM, and Docker
    # kills it when this runs out (some Docker installs default to just one second).
    stop_grace_period: 15s
    ports:
      - "8080:8080"
    environment:
      BEHIND_PROXY: ${BEHIND_PROXY:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      # Optional relay (TURN) for people whose networks block direct connections; see the turn service below.
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Optional sign-in with an OpenID Connect provider; see docs/accounts.md.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DESKTOP_CLIENT_ID: ${OIDC_DESKTOP_CLIENT_ID:-}
      OIDC_DESKTOP_CLIENT_SECRET: ${OIDC_DESKTOP_CLIENT_SECRET:-}
      ROOM_CREATION: ${ROOM_CREATION:-anyone}
      DEFAULT_ROOM_ACCESS: ${DEFAULT_ROOM_ACCESS:-anyone}
    volumes:
      - orvo-data:/data

  # Optional relay for people whose networks block direct connections, which shows up as video that never arrives.
  # Needs a Linux host with host networking and a public address, with UDP and TCP 3478 and UDP 49152-50175 open to
  # the internet. Then set, for the orvo service:  TURN_URLS=turn:<your-host>:3478  TURN_SECRET=<the same secret>
  #
  #   TURN_SECRET=<long random string> EXTERNAL_IP=<public address> docker compose --profile turn up -d
  turn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../turn/turnserver.full.conf:/etc/coturn/turnserver.conf:ro
    # Checked here, not with ${VAR:?}, because Compose would otherwise demand these even when the profile is off.
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      EXTERNAL_IP: ${EXTERNAL_IP:-}
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$TURN_SECRET" ] && [ -n "$$EXTERNAL_IP" ] || { echo "set TURN_SECRET and EXTERNAL_IP" >&2; exit 1; }; exec turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SECRET" --external-ip="$$EXTERNAL_IP"'

volumes:
  orvo-data:

# Personal Orvo: one container. Friends over the internet need HTTPS, so put your own reverse proxy in front of
# port 8080 (it must pass WebSocket upgrades on /ws) and set BEHIND_PROXY=1.
#
#   docker compose up -d                                  # http://localhost:8080
#   BEHIND_PROXY=1 docker compose up -d                   # behind a reverse proxy
#   docker compose --profile turn up -d                   # also run a relay (see the turn service)
services:
  orvo:
    # Published image. To build from this checkout instead, add `build: ../..` and run `docker compose up -d --build`.
    image: ${ORVO_IMAGE:-ghcr.io/peaceful-octopus/orvo:latest}
    restart: unless-stopped
    # Must be longer than DRAIN_MS (5 s): the server keeps serving for that long after SIGTERM, and Docker
    # kills it when this runs out (some Docker installs default to just one second).
    stop_grace_period: 15s
    ports:
      - "8080:8080"
    environment:
      BEHIND_PROXY: ${BEHIND_PROXY:-}
      # The admin page at /admin, for changing the settings below without restarting. It exists only with a password, and
      # only answers from your local network (open it by the server's LAN address) unless ADMIN_ALLOW_REMOTE=1.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_ALLOW_REMOTE: ${ADMIN_ALLOW_REMOTE:-}
      # Starting values for settings the admin page can change; what is saved there wins over these.
      MAX_ROOM_SIZE: ${MAX_ROOM_SIZE:-}
      WARN_ROOM_SIZE: ${WARN_ROOM_SIZE:-}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-}
      ANNOUNCEMENT: ${ANNOUNCEMENT:-}
      ANNOUNCEMENT_ID: ${ANNOUNCEMENT_ID:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      # Optional relay (TURN) for people whose networks block direct connections; see the turn service below.
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # Video quality sent through the relay, which uses your bandwidth: the defaults are 200 kbit/s, half size, 15 fps.
      # For quality close to a direct call try RELAY_VIDEO_KBPS=1000 RELAY_VIDEO_SCALE=1 RELAY_VIDEO_FPS=30.
      RELAY_VIDEO_KBPS: ${RELAY_VIDEO_KBPS:-}
      RELAY_VIDEO_SCALE: ${RELAY_VIDEO_SCALE:-}
      RELAY_VIDEO_FPS: ${RELAY_VIDEO_FPS:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Optional sign-in with an OpenID Connect provider; see docs/accounts.md.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DESKTOP_CLIENT_ID: ${OIDC_DESKTOP_CLIENT_ID:-}
      OIDC_DESKTOP_CLIENT_SECRET: ${OIDC_DESKTOP_CLIENT_SECRET:-}
      ROOM_CREATION: ${ROOM_CREATION:-anyone}
      DEFAULT_ROOM_ACCESS: ${DEFAULT_ROOM_ACCESS:-anyone}
    volumes:
      - orvo-data:/data

  # Optional relay for people whose networks block direct connections, which shows up as video that never arrives.
  # Needs a Linux host with host networking and a public address, with UDP and TCP 3478 and UDP 49152-50175 open to
  # the internet. Then set, for the orvo service:  TURN_URLS=turn:<your-host>:3478  TURN_SECRET=<the same secret>
  #
  # The relay has to know its public address. Give it a hostname that follows your IP (EXTERNAL_HOST) and it looks the
  # address up when it starts and every minute after that, restarting itself with the new one when it changes (calls
  # through the relay reconnect). Or give a fixed address (EXTERNAL_IP). LAN_IP, the host's address on your network, is
  # needed when the host sits behind a router doing NAT, so two people on the relay can reach each other.
  #
  #   TURN_SECRET=<long random string> EXTERNAL_HOST=turn.example.com LAN_IP=192.168.1.20 docker compose --profile turn up -d
  turn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    # Checked in the script, not with ${VAR:?}, because Compose would otherwise demand these even when the profile is off.
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      EXTERNAL_HOST: ${EXTERNAL_HOST:-}
      EXTERNAL_IP: ${EXTERNAL_IP:-}
      LAN_IP: ${LAN_IP:-}
    # The settings are written out here so this file works on its own, without the rest of the repository. They
    # mirror deploy/turn/turnserver.full.conf, and a test fails if the two drift apart. Keep the denied-peer-ip lines:
    # without them the relay is a way into the server's private network.
    entrypoint:
      - /bin/sh
      - -c
      - |
        resolve() { getent ahostsv4 "$$EXTERNAL_HOST" | awk 'NR==1 {print $$1}'; }
        if [ -n "$$EXTERNAL_HOST" ]; then PUBLIC=$$(resolve); else PUBLIC="$$EXTERNAL_IP"; fi
        [ -n "$$TURN_SECRET" ] && [ -n "$$PUBLIC" ] || { echo "set TURN_SECRET and EXTERNAL_HOST (or EXTERNAL_IP)" >&2; exit 1; }
        EXTERNAL="$$PUBLIC"; [ -n "$$LAN_IP" ] && EXTERNAL="$$PUBLIC/$$LAN_IP"
        cat > /tmp/turnserver.conf <<'EOF'
        listening-port=3478
        min-port=49152
        max-port=50175
        user-quota=20
        total-quota=2000
        use-auth-secret
        realm=orvo
        fingerprint
        no-cli
        no-multicast-peers
        no-tlsv1
        no-tlsv1_1
        no-tls
        no-dtls
        stale-nonce=600
        denied-peer-ip=0.0.0.0-0.255.255.255
        denied-peer-ip=10.0.0.0-10.255.255.255
        denied-peer-ip=100.64.0.0-100.127.255.255
        denied-peer-ip=127.0.0.0-127.255.255.255
        denied-peer-ip=169.254.0.0-169.254.255.255
        denied-peer-ip=172.16.0.0-172.31.255.255
        denied-peer-ip=192.0.0.0-192.0.0.255
        denied-peer-ip=192.168.0.0-192.168.255.255
        denied-peer-ip=198.18.0.0-198.19.255.255
        denied-peer-ip=224.0.0.0-255.255.255.255
        denied-peer-ip=::1-::1
        denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        EOF
        turnserver -c /tmp/turnserver.conf --static-auth-secret="$$TURN_SECRET" --external-ip="$$EXTERNAL" &
        PID=$$!
        trap 'kill $$PID' TERM INT
        if [ -n "$$EXTERNAL_HOST" ]; then
          while kill -0 $$PID 2>/dev/null; do
            sleep 60
            NOW=$$(resolve)
            if [ -n "$$NOW" ] && [ "$$NOW" != "$$PUBLIC" ]; then echo "$$EXTERNAL_HOST is now $$NOW (was $$PUBLIC); restarting" >&2; kill $$PID; break; fi
          done &
        fi
        wait $$PID

volumes:
  orvo-data:

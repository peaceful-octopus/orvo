# Test override: run the small-team stack on one machine without HTTPS or DNS names, for checking it end to end.
#
#   export SIGNING_KEY=test-1:<secret>   DOMAIN=localhost
#   docker compose -f compose.yaml -f compose.test.yaml up -d --build
#
# The beacon is on http://localhost:8080 (it also serves the web app), nodes on :9101 and :9102.
services:
  beacon:
    environment:
      BEHIND_PROXY: ""
      RATE_LIMIT_PER_MINUTE: "0"

  node-1:
    environment:
      PUBLIC_WS_URL: ws://localhost:9101/ws

  node-2:
    environment:
      PUBLIC_WS_URL: ws://localhost:9102/ws

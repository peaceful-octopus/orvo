# Small-team Orvo: a beacon, two signaling nodes and Redis. Same image as the personal setup.
# Scale by adding more `node-*` services.
#
#   pnpm --filter @orvo/sign-config start keygen --kid prod-1
#   export SIGNING_KEY=<kid>:<secretKey>          # from keygen; shared by every beacon
#   export DOMAIN=orvo.example.com               # the name the beacon and nodes are reached at (see below)
#   docker compose up -d
#
# HTTPS is not part of this file. Put your own reverse proxy in front, passing WebSocket upgrades on /ws, and route
#   orvo.example.com     to the beacon (host port 8080)
#   n1.orvo.example.com  to node-1     (host port 9101)
#   n2.orvo.example.com  to node-2     (host port 9102)
# The ports are published on every interface by default; bind them to 127.0.0.1 if the proxy is on this host.
#
# Optional relay for paid rooms: set TURN_URLS and TURN_SECRET (coturn with use-auth-secret);
# without them every room is STUN-only.
x-orvo: &orvo
  # The published image. To build from this checkout instead, run `docker compose up -d --build`.
  image: ${ORVO_IMAGE:-ghcr.io/peaceful-octopus/orvo:latest}
  build: ../..
  restart: unless-stopped
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Holds the operator's saved settings as well as room placement, so it keeps its data across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  beacon:
    <<: *orvo
    stop_grace_period: 15s
    command: ["node", "--enable-source-maps", "dist/beacon.js"]
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      SIGNING_KEY: ${SIGNING_KEY:?generate one with the sign-config keygen command}
      BEHIND_PROXY: "1"
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Optional sign-in with an OpenID Connect provider; see docs/accounts.md.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DESKTOP_CLIENT_ID: ${OIDC_DESKTOP_CLIENT_ID:-}
      OIDC_DESKTOP_CLIENT_SECRET: ${OIDC_DESKTOP_CLIENT_SECRET:-}
      ROOM_CREATION: ${ROOM_CREATION:-anyone}
      DEFAULT_ROOM_ACCESS: ${DEFAULT_ROOM_ACCESS:-anyone}
      # Optional admin page. Settings changed there are kept in Redis and used by every beacon. Behind your proxy the
      # page is reachable only with ADMIN_ALLOW_REMOTE=1, which is safe only because it needs the password.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_ALLOW_REMOTE: ${ADMIN_ALLOW_REMOTE:-}

  node-1:
    <<: *orvo
    # Longer than DRAIN_MS (30 s) so a stopping node can finish serving before Docker kills it.
    stop_grace_period: 45s
    command: ["node", "--enable-source-maps", "dist/signaling.js"]
    ports:
      - "9101:9000"
    environment: &node-env
      PORT: 9000
      REDIS_URL: redis://redis:6379
      BEACON_URL: http://beacon:8080
      NODE_ID: node-1
      PUBLIC_WS_URL: wss://n1.${DOMAIN:?set DOMAIN}/ws
      DRAIN_MS: 30000
    depends_on:
      - redis
      - beacon

  node-2:
    <<: *orvo
    stop_grace_period: 45s
    command: ["node", "--enable-source-maps", "dist/signaling.js"]
    ports:
      - "9102:9000"
    environment:
      <<: *node-env
      NODE_ID: node-2
      PUBLIC_WS_URL: wss://n2.${DOMAIN}/ws
    depends_on:
      - redis
      - beacon

  # Optional own STUN server (no relay, almost no bandwidth), instead of Google's public one.
  # Needs UDP 3478 open; then set STUN_URLS=stun:stun.<your domain>:3478 for the beacon.
  stun:
    profiles: ["stun"]
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: ["--stun-only", "--no-tls", "--no-dtls", "--no-cli", "--fingerprint", "--listening-port=3478"]

volumes:
  redis-data:

# Small-team ChillCall: a beacon, two signaling nodes and Redis, behind Caddy for HTTPS.
# Same image as the personal setup. Scale by adding more `node-*` services.
#
#   pnpm --filter @chillcall/sign-config start keygen --kid prod-1
#   export SIGNING_KEY=<kid>:<secretKey>          # from keygen; shared by every beacon
#   export DOMAIN=chill.example.com               # DNS: chill.example.com, n1.chill.example.com, n2.chill.example.com
#   docker compose up -d
#
# Optional relay for paid rooms: set TURN_URLS and TURN_SECRET (coturn with use-auth-secret);
# without them every room is STUN-only.
x-chillcall: &chillcall
  build: ../..
  restart: unless-stopped
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  beacon:
    <<: *chillcall
    stop_grace_period: 15s
    working_dir: /repo/apps/beacon
    command: ["node_modules/.bin/tsx", "src/main.ts"]
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      SIGNING_KEY: ${SIGNING_KEY:?generate one with the sign-config keygen command}
      WEB_DIR: /repo/apps/app/dist
      BEHIND_PROXY: "1"
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Optional sign-in with an OpenID Connect provider; see docs/accounts.md.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      ROOM_CREATION: ${ROOM_CREATION:-anyone}
      DEFAULT_ROOM_ACCESS: ${DEFAULT_ROOM_ACCESS:-anyone}

  node-1:
    <<: *chillcall
    # Longer than DRAIN_MS (30 s) so a stopping node can finish serving before Docker kills it.
    stop_grace_period: 45s
    working_dir: /repo/apps/signaling
    command: ["node_modules/.bin/tsx", "src/main.ts"]
    environment: &node-env
      PORT: 9000
      REDIS_URL: redis://redis:6379
      BEACON_URL: http://beacon:8080
      NODE_ID: node-1
      PUBLIC_WS_URL: wss://n1.${DOMAIN:?set DOMAIN}/ws
      DRAIN_MS: 30000
    depends_on:
      - redis
      - beacon

  node-2:
    <<: *chillcall
    stop_grace_period: 45s
    working_dir: /repo/apps/signaling
    command: ["node_modules/.bin/tsx", "src/main.ts"]
    environment:
      <<: *node-env
      NODE_ID: node-2
      PUBLIC_WS_URL: wss://n2.${DOMAIN}/ws
    depends_on:
      - redis
      - beacon

  # Optional own STUN server (no relay, almost no bandwidth), instead of Google's public one.
  # Needs UDP 3478 open; then set STUN_URLS=stun:stun.<your domain>:3478 for the beacon.
  stun:
    profiles: ["stun"]
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: ["--stun-only", "--no-tls", "--no-dtls", "--no-cli", "--fingerprint", "--listening-port=3478"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - beacon
      - node-1
      - node-2

volumes:
  caddy-data:

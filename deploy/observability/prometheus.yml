# Prometheus scrape configuration for a ChillCall deployment. Edit the targets to match your hosts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: chillcall-beacon
    metrics_path: /metrics
    static_configs:
      - targets: ["beacon:8080"]

  - job_name: chillcall-signaling
    metrics_path: /metrics
    static_configs:
      - targets: ["node-1:9000", "node-2:9000"]
